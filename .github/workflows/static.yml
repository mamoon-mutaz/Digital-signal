<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإشارات الرقمية | هندسة تقنيات الحاسوب</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
/* =================== RESET & BASE =================== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --primary: #667eea;
    --primary-dark: #5568d3;
    --secondary: #764ba2;
    --accent: #f093fb;
    --bg-dark: #0f0f23;
    --bg-card: #ffffff;
    --bg-light: #f0f2f8;
    --text-dark: #1a1a2e;
    --text-light: #6b7280;
    --text-white: #ffffff;
    --success: #10b981;
    --error: #ef4444;
    --warning: #f59e0b;
    --radius: 16px;
    --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.12);
    --sidebar-width: 280px;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg-light);
    color: var(--text-dark);
    display: flex;
    min-height: 100vh;
    overflow-x: hidden;
}

/* =================== SIDEBAR =================== */
.sidebar {
    width: var(--sidebar-width);
    background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: var(--text-white);
    height: 100vh;
    position: fixed;
    right: 0;
    top: 0;
    display: flex;
    flex-direction: column;
    z-index: 1000;
    transition: transform 0.3s ease;
    overflow-y: auto;
}

.sidebar-header {
    padding: 28px 20px 20px;
    text-align: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.logo-icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 12px;
}

.logo-icon svg {
    width: 100%;
    height: 100%;
}

.sidebar-header h2 {
    font-size: 28px;
    font-weight: 900;
    background: linear-gradient(135deg, #667eea, #f093fb);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 2px;
}

.sidebar-header p {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.6);
    margin-top: 4px;
}

.nav-links {
    list-style: none;
    padding: 16px 0;
    flex: 1;
}

.nav-item {
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: all 0.25s ease;
    border-right: 3px solid transparent;
    color: rgba(255, 255, 255, 0.7);
    font-size: 15px;
    font-weight: 600;
}

.nav-item:hover {
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-white);
    padding-right: 28px;
}

.nav-item.active {
    background: linear-gradient(90deg, rgba(102, 126, 234, 0.2), transparent);
    border-right-color: var(--primary);
    color: var(--text-white);
}

.nav-icon {
    font-size: 18px;
    width: 24px;
    text-align: center;
    color: var(--primary);
}

.nav-item.active .nav-icon {
    color: var(--accent);
}

.sidebar-footer {
    padding: 16px 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    text-align: center;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.4);
    line-height: 1.8;
}

/* =================== MAIN CONTENT =================== */
.main-content {
    flex: 1;
    margin-right: var(--sidebar-width);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
}

/* =================== PAGES =================== */
.page {
    display: none;
    flex: 1;
    padding: 0;
    animation: fadeIn 0.4s ease;
}

.page.active {
    display: block;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* =================== WELCOME PAGE =================== */
.welcome-hero {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
}

.hero-bg-pattern {
    position: absolute;
    inset: 0;
    background-image:
        radial-gradient(circle at 20% 50%, rgba(102, 126, 234, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(240, 147, 251, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 80%, rgba(118, 75, 162, 0.15) 0%, transparent 50%);
}

.hero-bg-pattern::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 50px 50px;
}

.hero-content {
    text-align: center;
    z-index: 2;
    padding: 40px 20px;
    max-width: 800px;
}

.hero-badge {
    display: inline-block;
    padding: 8px 24px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 50px;
    color: rgba(255, 255, 255, 0.8);
    font-size: 14px;
    margin-bottom: 24px;
    backdrop-filter: blur(10px);
    background: rgba(255, 255, 255, 0.05);
}

.hero-title {
    font-size: 52px;
    font-weight: 900;
    color: var(--text-white);
    margin-bottom: 12px;
    line-height: 1.2;
    text-shadow: 0 4px 20px rgba(102, 126, 234, 0.5);
}

.hero-subtitle {
    font-size: 32px;
    font-weight: 700;
    background: linear-gradient(135deg, #667eea, #f093fb);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 16px;
}

.hero-desc {
    font-size: 20px;
    color: rgba(255, 255, 255, 0.7);
    margin-bottom: 40px;
    font-weight: 600;
}

.hero-wave {
    max-width: 600px;
    margin: 0 auto 40px;
}

.hero-wave svg {
    width: 100%;
    height: 80px;
}

.hero-cards {
    display: flex;
    gap: 24px;
    justify-content: center;
    flex-wrap: wrap;
}

.hero-card {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: var(--radius);
    padding: 20px 32px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
    min-width: 140px;
}

.hero-card:hover {
    transform: translateY(-5px);
    background: rgba(255, 255, 255, 0.12);
    border-color: var(--primary);
    box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
}

.card-num {
    display: block;
    font-size: 36px;
    font-weight: 900;
    color: var(--accent);
    margin-bottom: 4px;
}

.card-label {
    display: block;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.7);
    font-weight: 600;
}

/* =================== PAGE HEADER =================== */
.page-header {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    padding: 48px 40px;
    color: var(--text-white);
}

.page-header h1 {
    font-size: 32px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 12px;
}

.page-icon {
    font-size: 28px;
}

.page-header p {
    margin-top: 8px;
    font-size: 16px;
    color: rgba(255, 255, 255, 0.8);
}

/* =================== CARDS GRID (PDFs) =================== */
.cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
    padding: 40px;
}

.pdf-card {
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 28px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: var(--shadow);
    border: 2px solid transparent;
    position: relative;
    overflow: hidden;
}

.pdf-card::before {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    width: 100%;
    height: 4px;
    background: linear-gradient(90deg, var(--primary), var(--accent));
    transform: scaleX(0);
    transform-origin: right;
    transition: transform 0.3s ease;
}

.pdf-card:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-lg);
    border-color: rgba(102, 126, 234, 0.2);
}

.pdf-card:hover::before {
    transform: scaleX(1);
}

.pdf-card-icon {
    font-size: 48px;
    margin-bottom: 16px;
}

.pdf-card h3 {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-dark);
    margin-bottom: 8px;
}

.pdf-card p {
    font-size: 14px;
    color: var(--text-light);
    line-height: 1.5;
}

.pdf-badge {
    display: inline-block;
    margin-top: 12px;
    padding: 4px 12px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: white;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
}

/* =================== VIDEOS GRID =================== */
.videos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 24px;
    padding: 40px;
}

.video-card {
    background: var(--bg-card);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: all 0.3s ease;
}

.video-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-lg);
}

.video-card video {
    width: 100%;
    display: block;
    background: #000;
    aspect-ratio: 16/9;
}

.video-label {
    padding: 16px 20px;
}

.video-tag {
    display: inline-block;
    padding: 4px 12px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: white;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 8px;
}

.video-label h3 {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-dark);
}

/* =================== PDF VIEWER SECTION =================== */
.pdf-viewer-section {
    padding: 40px;
    display: flex;
    justify-content: center;
}

.pdf-viewer-card {
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 48px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: var(--shadow);
    max-width: 600px;
    width: 100%;
    border: 2px solid transparent;
}

.pdf-viewer-card:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-lg);
    border-color: var(--primary);
}

.pdf-viewer-icon {
    font-size: 72px;
    margin-bottom: 20px;
}

.pdf-viewer-card h2 {
    font-size: 24px;
    font-weight: 800;
    color: var(--text-dark);
    margin-bottom: 12px;
}

.pdf-viewer-card p {
    font-size: 16px;
    color: var(--text-light);
    line-height: 1.6;
    margin-bottom: 24px;
}

.view-btn {
    padding: 12px 32px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: white;
    border: none;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: 'Cairo', sans-serif;
}

.view-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
}

/* =================== QUIZ =================== */
.quiz-container {
    padding: 40px;
    max-width: 800px;
    margin: 0 auto;
}

.quiz-setup {
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 40px;
    text-align: center;
    box-shadow: var(--shadow);
}

.quiz-mode-select h2 {
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 24px;
    color: var(--text-dark);
}

.mode-buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 28px;
}

.mode-btn {
    padding: 12px 24px;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    background: var(--bg-card);
    color: var(--text-light);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
    font-family: 'Cairo', sans-serif;
}

.mode-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
}

.mode-btn.active {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: white;
    border-color: transparent;
}

.start-quiz-btn {
    padding: 16px 48px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: white;
    border: none;
    border-radius: 50px;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: 'Cairo', sans-serif;
    box-shadow: 0 4px 20px rgba(102, 126, 234, 0.3);
}

.start-quiz-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 30px rgba(102, 126, 234, 0.5);
}

/* Quiz Active */
.quiz-active {
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 32px;
    box-shadow: var(--shadow);
}

.quiz-progress-bar {
    width: 100%;
    height: 8px;
    background: #e5e7eb;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 24px;
}

.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--accent));
    border-radius: 4px;
    transition: width 0.3s ease;
    width: 0%;
}

.quiz-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
}

.quiz-counter {
    font-size: 16px;
    font-weight: 700;
    color: var(--primary);
}

.quiz-score {
    font-size: 16px;
    font-weight: 700;
    color: var(--success);
}

.quiz-question-box h3 {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-dark);
    line-height: 1.6;
    margin-bottom: 24px;
    padding: 20px;
    background: var(--bg-light);
    border-radius: 12px;
    border-right: 4px solid var(--primary);
}

.quiz-options {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.quiz-option {
    padding: 16px 20px;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-dark);
    background: var(--bg-card);
    display: flex;
    align-items: center;
    gap: 12px;
}

.quiz-option:hover {
    border-color: var(--primary);
    background: rgba(102, 126, 234, 0.05);
}

.quiz-option.selected {
    border-color: var(--primary);
    background: rgba(102, 126, 234, 0.1);
}

.quiz-option.correct {
    border-color: var(--success);
    background: rgba(16, 185, 129, 0.1);
    color: var(--success);
}

.quiz-option.incorrect {
    border-color: var(--error);
    background: rgba(239, 68, 68, 0.1);
    color: var(--error);
}

.quiz-option .option-letter {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--bg-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 14px;
    flex-shrink: 0;
}

.quiz-option.correct .option-letter {
    background: var(--success);
    color: white;
}

.quiz-option.incorrect .option-letter {
    background: var(--error);
    color: white;
}

.quiz-option.disabled {
    cursor: not-allowed;
    pointer-events: none;
}

.quiz-nav {
    display: flex;
    justify-content: space-between;
    margin-top: 24px;
    gap: 12px;
}

.quiz-nav-btn {
    padding: 12px 32px;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    background: var(--bg-card);
    color: var(--text-dark);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: 'Cairo', sans-serif;
}

.quiz-nav-btn:hover:not(:disabled) {
    border-color: var(--primary);
    color: var(--primary);
}

.quiz-nav-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.quiz-nav-btn.finish {
    background: linear-gradient(135deg, var(--success), #059669);
    color: white;
    border-color: transparent;
}

/* Quiz Results */
.quiz-results {
    display: flex;
    justify-content: center;
}

.results-card {
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 48px;
    text-align: center;
    box-shadow: var(--shadow-lg);
    max-width: 700px;
    width: 100%;
}

.results-icon {
    font-size: 72px;
    margin-bottom: 16px;
}

.results-card h2 {
    font-size: 28px;
    font-weight: 800;
    color: var(--text-dark);
    margin-bottom: 20px;
}

.results-score {
    margin: 20px 0;
}

.big-score {
    font-size: 64px;
    font-weight: 900;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.total-score {
    font-size: 24px;
    color: var(--text-light);
    font-weight: 700;
}

.results-percent {
    font-size: 20px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 8px;
}

.results-message {
    font-size: 16px;
    color: var(--text-light);
    margin-bottom: 24px;
}

.results-review {
    text-align: right;
    max-height: 300px;
    overflow-y: auto;
    margin-bottom: 24px;
    padding: 16px;
    background: var(--bg-light);
    border-radius: 12px;
}

.review-item {
    padding: 12px 0;
    border-bottom: 1px solid #e5e7eb;
}

.review-item:last-child {
    border-bottom: none;
}

.review-q {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-dark);
    margin-bottom: 4px;
}

.review-a {
    font-size: 13px;
    color: var(--text-light);
}

.review-a .correct-a {
    color: var(--success);
    font-weight: 700;
}

.review-a .wrong-a {
    color: var(--error);
    text-decoration: line-through;
}

.retry-btn {
    padding: 14px 40px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: white;
    border: none;
    border-radius: 50px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: 'Cairo', sans-serif;
}

.retry-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
}

/* =================== FOOTER =================== */
.site-footer {
    background: linear-gradient(180deg, #1a1a2e, #0f0f23);
    color: rgba(255, 255, 255, 0.7);
    padding: 40px 20px 24px;
    text-align: center;
    margin-top: auto;
}

.footer-wave {
    max-width: 600px;
    margin: 0 auto 20px;
}

.footer-wave svg {
    width: 100%;
    height: 30px;
}

.footer-text {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-white);
    margin-bottom: 4px;
}

.footer-sub {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.4);
}

/* =================== PDF MODAL =================== */
.pdf-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.8);
    z-index: 2000;
    padding: 20px;
    backdrop-filter: blur(4px);
}

.pdf-modal.active {
    display: flex;
    align-items: center;
    justify-content: center;
}

.pdf-modal-content {
    width: 100%;
    max-width: 1200px;
    height: 90vh;
    background: white;
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

.pdf-modal-header {
    padding: 16px 24px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.pdf-modal-header h3 {
    font-size: 18px;
    font-weight: 700;
}

.pdf-close {
    background: rgba(255, 255, 255, 0.2);
    border: none;
    color: white;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    transition: all 0.2s ease;
}

.pdf-close:hover {
    background: rgba(255, 255, 255, 0.3);
    transform: rotate(90deg);
}

/* =================== MOBILE MENU =================== */
.mobile-menu-btn {
    display: none;
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 1500;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    border: none;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    cursor: pointer;
    padding: 10px;
    flex-direction: column;
    justify-content: space-between;
}

.mobile-menu-btn span {
    display: block;
    width: 100%;
    height: 3px;
    background: white;
    border-radius: 2px;
    transition: all 0.3s ease;
}

/* =================== RESPONSIVE =================== */
